## objectives
subzero.yttrium = Ante todo, mina un poco de [#969ea3]yttrium[] para empezar a construir una base.
subzero.drill = Abre el árbol tecnológico \ue875, investiga el [#969ea3]micro drill[].
subzero.drillplace = Coloca algunos [#969ea3]micro drills[] sobre los minerales de [#969ea3]yttrium[].
subzero.yttriumcore = Investiga y coloca [#969ea3]conveyors[] para conectar los taladros con el núcleo.
subzero.arcanite = Ahora haz lo mismo con el [#d17b2a]arcanite[].
subzero.atg = Para generar [accent]\ue810[] energía, investiga el [#d17b2a]ATG generator[] y suminístrale [#d17b2a]arcanite[].
subzero.icecrusher = Investiga el [#95c4e6]ice crusher[] \nColócalo junto a las [#4594de]glacier walls[].
subzero.node = Conecta [accent]\ue810[] energía a los [#95c4e6]ice crushers[]. \nInvestiga y coloca el [#969ea3]yttrium node[].
subzero.ice = Extrae 40 [#95c4e6]ice shards[].
subzero.pin = Para defender tu base del enemigo, investiga la [#969ea3]Pin turret[].
subzero.pinplace = Colócala aquí y suminístrale [#969ea3]yttrium[].
subzero.constructor = Ahora, para atacar la base enemiga, investiga el [#969ea3]mech constructor[].
subzero.units = Produce dos mechs [#969ea3]blade[].
subzero.core = \ue865 Ataca el [red]núcleo enemigo[]. \nExpande tu base. \n¡Buena suerte!

lonelake.pump = Este lago está lleno de [#39cce3]cryofluid[], puede ser útil.\nInvestiga la [#969ea3]yttrium pump[].
lonelake.pipes = Para transportar líquidos necesitas [#969ea3]pipes[].
lonelake.pumps = Coloca una [#969ea3]pump[] sobre el [#39cce3]cryofluid[].
lonelake.cryo = Ahora investiga y coloca el [#43a3e8]cryogenium soldifier[] y conéctalo a la [#969ea3]pump[]. \nTambién necesitas [accent]\ue810[] energía para esto.
lonelake.cryogenium = Lleva algo de [#39cce3]cryogenium[] al núcleo, o úsalo como munición para las nuevas torretas.
lonelake.battery = La [accent]Battery[] debería ayudar si tu base sufre cortes de energía.
lonelake.heater = El [#a31c1c]Heater[] calienta los [#95c4e6]ice shards[] y los convierte en [#2d6feb]water[] para su posterior procesamiento.
lonelake.arcalith = El [#d17b2a]Arcalith[] es un líquido muy útil, se usa para producir [accent]\ue810[] energía y recursos.
lonelake.mender = Si tu defensa está dañada, coloca algunos [#288c22]menders[]. \nLos [#288c22]Menders[] pueden potenciarse con [#d17b2a]arcalith[].

cavern.crusher = Esta base enemiga es mucho más fuerte que la anterior. \nNecesitarás mejores materiales. \nInvestiga el [#d17b2a]Bauxite crusher[] y avanza.
cavern.crusherplace = Colócalos enfrentando las [#d17b2a]bauxite walls[].
cavern.foundry = Para fundirlos en un material muy importante, investiga y coloca la [#969ea3]aluminium foundry[].
cavern.aluminium = Lleva [#969ea3]aluminium[] al núcleo. No olvides la [accent]\ue810[] energía.
cavern.cryofluid = Para continuar necesitarás [#39cce3]cryogenium[]... \npero... ¿dónde está el cryofluid?
cavern.cryofluidplace = El [#39cce3]Cryofluid Combiner[] puede producir [#39cce3]cryofluid[] usando [#2d6feb]water[] y [#95c4e6]ice shards[].
cavern.cryogenium = Ahora recoge algo de [#39cce3]cryogenium[] para el núcleo, créeme que te hará falta.
cavern.cryothermal = Los [#d17b2a]ATG generators[] probablemente no puedan manejar la demanda de [accent]\ue810[] energía. \nInvestiga el [#43a3e8]cryothermal generator[].
cavern.cryothermalplace = Los [#43a3e8]cryothermal generators[] son mucho más potentes que los [#d17b2a]ATG[], \n¡y además producen [#2d6feb]water[] como subproducto!
cavern.power = Enciende esos generadores y prepara las defensas.

seaside.drill = ¡Por fin un nuevo taladro! El [#d17b2a]sickle drill[]. \nPuede extraer [#95c4e6]moonstone[].
seaside.moonstone = Extrae [#95c4e6]moonstone[].
seaside.factory = Para seguir avanzando necesitarás nuevas torretas. \nInvestiga la [#b0c6d6]aerogel factory[].
seaside.factoryplace = El [#b0c6d6]aerogel[] es un material muy ligero usado en torretas y unidades de nivel medio.
seaside.xenon = Para fabricarlo necesitarás [#43a3e8]xenon concentrators[].
seaside.aerogel = Derrite un poco de hielo y fabrica 50 de [#b0c6d6]aerogel[].
seaside.wall = Para evitar que los láseres atraviesen toda la defensa, \ncoloca algunas [#b0c6d6]aerogel walls[].

passage.drill = Aquí estamos. El [#d17b2a]sickle drill[] puede extraer [#95c4e6]moonstone[].
passage.moonstone = Extrae un poco de [#95c4e6]moonstone[].
passage.conveyor = Puedes mejorar tus conveyors de yttrium a los más rápidos [#584494]moonstone conveyors[].
passage.some = Revisa también el árbol tecnológico, quizás encuentres algo útil.
passage.way = Ábrete camino hacia el siguiente sector.

solar.d1 = Este es uno de los sectores más defendidos..
solar.d2 = No sabemos por qué [#4785ff]Bushark[] lo construyó aquí.. \nen medio de la nada
solar.d3 = Prepare strong defences, make units, do not wait.

river.drill = El [#6699d4]ray drill[] puede extraer [#95c4e6]diamonds[] y potenciarse con [#3365b8]xenon[].
river.drillplace = Los [#95c4e6]diamonds[] son minerales fuertes y útiles, usados en maquinaria y torretas de alto nivel.
river.loader = No tienes que colocar cintas por todo el mapa. \nInvestiga el [#6699d4]cargo loader[] y el [#6699d4]cargo unloader[].
river.unloader = No tienes que colocar cintas por todo el mapa. \nInvestiga el [#6699d4]cargo loader[] y el [#6699d4]cargo unloader[].
river.loaderplace = Coloca el [#6699d4]loader[] cerca de los taladros de diamante.
river.unloaderplace = Y el [#6699d4]unloader[] cerca del núcleo.
river.salmon = Pon algo de [#3365b8]xenon[] en el cargo loader para que produzca la unidad [#6699d4]salmon cargo unit[]. \nEl [#3365b8]Xenon[] también puede potenciar los [#6699d4]ray drills[].
river.diamonds = Entrega [#95c4e6]diamonds[] al núcleo.

announce.enemybreach = [red]\u26A0 ADVERTENCIA \u26A0[]\n[lightgray]Refuerzos enemigos en camino
objective.enemybreach = [accent]Ataque masivo enemigo en [lightgray]{0}[]

crash.text1 = En este punto realmente deberías invertir en defensa. \nLa base principal se acerca.
crash.ionized = Investiga el [#39cce3]ionized xenon mixer[]. Se puede usar para producción avanzada de unidades. \nO como combustible para el siguiente [#43a3e8]generator[].
crash.generator = Investiga el [#43a3e8]ionized xenon generator[]. \nEs un generador completamente seguro que produce grandes cantidades de [accent]\ue810[] energía.
crash.fabricator = Ahora investiga el [#43a3e8]cryofabricator[]. Suminístrale recursos.
crash.cryofabric = El [#3365b8]Cryofabric[] es un material muy fuerte, frío y duradero capaz de reflejar balas \ny absorber láseres. No lo lamas.

frontline.text1 = Te dije que este sector no sería fácil, ¿verdad? \nEstá justo frente a la [#4785ff]Bushark Fortress[].
frontline.text2 = Coloca tantas defensas como puedas. \nSobrevive 10 oleadas.

fortress.text1 = Y finalmente, aquí estamos... [#4785ff]The Fortress[]...
fortress.text2 = Esta base no es ninguna broma. Aquí se encuentra la mayor arma de los Bushark: [#4785ff]The Restart[].
fortress.text3 = No dejes que el enemigo forme grandes grupos de unidades, destrúyela lo más rápido posible. \n¡Buena suerte!

asylum.text1 = Este asteroide está entre [#39cce3]Zilo[] y [#584494]Serpulo[]. \nEso significa que ambas facciones están interesadas en este lugar.
asylum.text2 = Defiéndete en dos frentes. Al final te espera una buena tecnología.

foundation.text1 = El enemigo aquí es más débil, no necesitas una defensa muy fuerte.
foundation.text2 = Roba la nueva tecnología de esta base.

## units
