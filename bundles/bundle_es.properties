## sectors
sector.moon-mod-The-asylum.name = The Asylum
sector.moon-mod-The-asylum.description = Un vasto lugar ubicado en un asteroide. Aquí, Bushark de Zilo se ha aliado con Crux. Ambas facciones están centradas únicamente en destruirte.
sector.moon-mod-The-asylum.details = Este asteroide es un lugar pacífico y distante con muchos recursos. Cuando Bushark notó tu presencia, alertaron a Crux y ambas facciones acordaron aliarse. Están centrados únicamente en destruirte.
sector.moon-mod-Frosty-prelude.name = Ground Sub Zero
sector.moon-mod-Frosty-prelude.description = El lugar perfecto para tus primeros pasos en Zilo: recolecta nuevos materiales, investiga nueva tecnología y destruye el puesto avanzado enemigo cercano.
sector.moon-mod-Frosty-prelude.details = Este puesto avanzado... no es Crux... ¿Bushark? ¿Una facción de Tantros? ¿Qué quieren de este planeta?
sector.moon-mod-Lonely-lake.name = Lonely Lake
sector.moon-mod-Lonely-lake.description = Un lago de cryofluid ubicado entre montañas. ¿Quizás podamos usarlo para investigar nuevas tecnologías?
sector.moon-mod-Transit-cavern.name = Transit Cavern
sector.moon-mod-Transit-cavern.description = Una cueva usada para transportar recursos y mercancías. Tenemos que debilitar a nuestros enemigos. Toma este lugar y erradica a todo enemigo en tu camino.
sector.moon-mod-Secret-passage.name = Secret Passage
sector.moon-mod-Secret-passage.description = Nuestro siguiente objetivo principal es otra base enemiga ubicada a lo largo de las montañas soleadas. Lamentablemente el terreno no nos permite atacarla de frente, tenemos que atravesar este desfiladero claustrofóbico...
sector.moon-mod-Solar-peaks.name = Solar Peaks
sector.moon-mod-Solar-peaks.description = Una de las 2 bases principales de Bushark en Zilo. Su tecnología supera con creces la tuya, pero ya no hay vuelta atrás: erradica todo y roba su tecnología.
sector.moon-mod-Solar-peaks.details = Una base construida en un lugar estratégico. Bushark está aquí principalmente por el terreno. Creen que es imposible acercarse desde ningún lado, pero encontraste un pequeño desfiladero y te abriste paso.
sector.moon-mod-Cryo-river.name = Cryo River
sector.moon-mod-Cryo-river.description = Un río de Cryofluid con restos de una antigua base enemiga. Captúralo para hacer retroceder a nuestros enemigos.
sector.moon-mod-Crash-landing.name = CrashLanding
sector.moon-mod-Crash-landing.description = Un terreno devastado por una nave espacial que se estrelló aquí. ¿Quizás podamos encontrar nueva tecnología?
sector.moon-mod-Crash-landing.details = La primera nave espacial que entró en este sistema solar explotó por razones desconocidas. Aproximadamente la mitad se estrelló aquí; la otra mitad se puede encontrar en Serpulo. Debido a la fina atmósfera de Zilo, la nave impactó directamente contra el suelo en lugar de quemarse al caer.
sector.moon-mod-Frontline.name = Frontline
sector.moon-mod-Frontline.description = Estamos preparando nuestro objetivo final, la base principal de Bushark en Zilo, también conocida como The Fortress. Ya conocen nuestros planes y nos están lanzando todo lo que tienen. Si consigues defenderte, podremos lanzar un ataque contra The Fortress.
sector.moon-mod-Fortress.name = The Fortress
sector.moon-mod-Fortress.description = La mayor base que Bushark haya construido jamás. Muchos ataques se han lanzado aquí, ninguno tuvo éxito. Tienen un arma superpoderosa inimaginable protegiendo su entrada principal. Esta base está extremadamente defendida. Cuanto más tiempo pases defendiendo, más difícil se pone. Tu base será atacada constantemente; debes lanzar contraataques exitosos para sobrevivir. Si consigues capturar esta base, todo Zilo estará bajo nuestro control.
sector.moon-mod-Fortress.details = La primera y más fuerte base de Bushark. Al principio solo estaba planeada como instalación de investigación. Al encontrar la tecnología fragmentaria y darse cuenta de su potencial, decidieron seguir investigándola. Después de años inventaron las primeras armas como la Defragmentation, pero no fue suficiente. Encontraron una forma de desencadenar una reacción en cadena entre átomos afectados por la división fragmentaria, algo que al principio parecía imposible. Entonces crearon esta superarma. Restart fue el único proyecto que usó esta nueva tecnología fragmentaria; es casi un milagro tecnológico, nunca seríamos capaces de investigarlo. Pero los Bushark son inventores, aman la tecnología nueva. Desafortunadamente, una vez que hayas destruido todo aquí, no obtendremos nueva información, pero al menos tendremos un planeta entero para nosotros.
sector.moon-mod-foundation.name = Foundation
