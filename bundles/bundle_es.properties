unit.moon-mod-cryomech4.description = Equipado con dos cañones de yttrium de aún mayor alcance.
unit.moon-mod-cryomech5.name = Decimate
unit.moon-mod-cryomech5.description = Equipado con dos lanzabombas, muy resistente.

unit.moon-mod-axoflare.name = Quark
