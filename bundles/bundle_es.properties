unit.moon-mod-axoflare5.name = Quantum
unit.moon-mod-axoflare5.description = Dispara una serie de 10 potentes balas de energía; no puede curar aliados pero tiene un escudo.

unit.moon-mod-salmon.name = Salmon
unit.moon-mod-salmon.description = Unidad pequeña y barata usada para transportar recursos.

unit.moon-mod-coreflare.name = Stellar
