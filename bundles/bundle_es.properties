block.moon-mod-xenon-synthezator.name = Xenon Concentrator
block.moon-mod-xenon-synthezator.description = Separa el Xenon del resto del aire.
block.moon-mod-heater.name = Heater
block.moon-mod-heater.description = Calienta el hielo y lo derrite en Water.
block.moon-mod-cryogenium-extractor.name = Cryogenium Solidfier
block.moon-mod-cryogenium-extractor.description = Solidifica Cryofluid en Cryogenium.
block.moon-mod-aluminium-foundry.name = Aluminium Foundry
block.moon-mod-arcanthium-mixer.name = Arcanthium Mixer
block.moon-mod-arcanthium-mixer.description = Fabrica Arcanthium a partir de varios materiales.
block.moon-mod-cryofabricator.name = Cryofabricator
