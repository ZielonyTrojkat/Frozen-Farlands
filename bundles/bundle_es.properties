block.moon-mod-micro-drill.name = Micro Drill
block.moon-mod-micro-drill.description = Un taladro pequeño y barato, efectivo en grandes cantidades.
block.moon-mod-sickledrill.name = Sickle Drill
block.moon-mod-sickledrill.description = Mina más rápido usando hojas afiladas.
block.moon-mod-raydrill.name = Ray Drill
block.moon-mod-raydrill.description = Mina aún más rápido usando tecnología fragmentaria, puede acelerarse con Xenon. Requiere energía.
block.moon-mod-bauxite-crusher.name = Bauxite Crusher
block.moon-mod-bauxite-crusher.description = Un taladro diseñado para minar Bauxite.
block.moon-mod-ice-crusher.name = Ice Crusher
block.moon-mod-ice-crusher.description = Un taladro diseñado para recolectar hielo.
