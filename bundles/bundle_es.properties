unit.moon-mod-excisionflare.name = Sullivbane Laserking
unit.moon-mod-excisionflare.description = LETS GET FUCKIN LOOOOOOOOOOOUUUD!!!
unit.moon-mod-resotank6.name = Do not even ask...
## turrets
block.moon-mod-Defragmentation.name = Defragmentation
block.moon-mod-Defragmentation.description = Dispara un láser perforante de medio alcance que divide a los enemigos desde dentro.
block.moon-mod-Defragmentation.details = Ejemplo básico del poder fragmentario, fue la primera arma diseñada para usar esta tecnología.
block.moon-mod-Alectro.name = Alectro
block.moon-mod-Alectro.description = Una poderosa torreta perfecta para eliminar hordas de enemigos desde gran distancia.
block.moon-mod-Leech.name = Leech
block.moon-mod-Leech.description = Inflige daño constante a un solo objetivo usando un láser de medio alcance.
block.moon-mod-Stormer.name = Stormer
block.moon-mod-Stormer.description = Lanzamisiles de largo alcance, puede usar varios materiales para disparar diferentes tipos de cohetes.
block.moon-mod-Zap.name = Zap
block.moon-mod-Zap.description = Una pequeña torreta capaz de infligir daño serio y aturdir a los enemigos.
block.moon-mod-Tide.description = Una torreta de líquido simple de medio alcance.
block.moon-mod-Frostbite.name = Frostbite
block.moon-mod-Frostbite.description = Devasta absolutamente a los enemigos con su potente rayo fragmentario extremadamente frío.
block.moon-mod-Frostbite.details = Esta arma es la cima de la tecnología fragmentaria básica, investigar más sería casi imposible.
block.moon-mod-Pike.description = Una pequeña torreta, buena para eliminar objetivos individuales.
block.moon-mod-Pike.name = Pike
block.moon-mod-Tide.name = Tide
block.moon-mod-Dragonfly.name = Dragonfly
block.moon-mod-Dragonfly.description = Dispara una lluvia de balas a los enemigos.
block.moon-mod-icicle.name = Icycle
block.moon-mod-icicle.description = Torreta de medio alcance que apunta a las balas enemigas.
block.moon-mod-MoonRay.name = Moonray
block.moon-mod-MoonRay.description = Se carga para disparar una sola bala perforante.
block.moon-mod-Restart.name = Restart
block.moon-mod-Restart.description = Una superarma fragmentaria, capaz de lidiar con los enemigos con facilidad.
block.moon-mod-Restart.details = Una de las invenciones más poderosas de Bushark, su único prototipo defiende The Fortress en Zilo. Principalmente por esto su base nunca cayó, siendo un absoluto milagro tecnológico, imposible de recrear.
block.moon-mod-Flame.name = Flame
block.moon-mod-Flame.description = La antigua torreta antiaérea de Bushark. Ya no se usa.
block.moon-mod-pin.name = Pin
block.moon-mod-pin.description = Dispara balas individuales de Yttrium a los enemigos.
block.moon-mod-Stinger.name = Stinger
block.moon-mod-Stinger.description = Golpea a los enemigos con una sola bala puntiaguda.
