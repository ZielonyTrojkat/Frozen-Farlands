block.moon-mod-cryofluid-combiner.name = Cryofluid Combiner
block.moon-mod-cryofluid-combiner.description = Mezcla water e ice shards para crear Cryofluid.
block.moon-mod-aluminium-blast-kiln.name = Aluminium Blast Kiln
block.moon-mod-aluminium-blast-kiln.description = Produce más Aluminium usando Bauxite y Arcanite, también produce Yttrium como subproducto.
block.moon-mod-arcalith-synthesizer.name = Arcalith Synthesizer
block.moon-mod-arcalith-synthesizer.description = Sintetiza aún más Arcalith a partir de water y Arcanite.

## team
team.blue.name = Bushark
## Effects
status.moon-mod-Fragment-split.name = Fragmental Split
status.moon-mod-Fragment-split.details = Reacción que hace que los átomos se comporten de forma extraña. Después de un tiempo toda la estructura de un átomo colapsa por completo resultando en desintegración.
status.moon-mod-fragmental-collapsion.name = Fragmental Collapse
status.moon-mod-fragmental-collapsion.details = Fragmental Split acelerado con una reacción en cadena de propagación extremadamente rápida, altamente destructivo.
status.moon-mod-paralyzed.name = Paralyzed
status.moon-mod-paralyzed.details = El Arcanthium puede producir voltajes extremadamente altos, provocando el fallo de la mayoría de los sistemas.
